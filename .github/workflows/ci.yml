name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests on SQLite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Tests (unit, integration, legacy parity)
        run: vendor/bin/phpunit

  mariadb:
    name: Integration tests on MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: orders_test
          MARIADB_USER: orders
          MARIADB_PASSWORD: secret
          MARIADB_RANDOM_ROOT_PASSWORD: "1"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DB_DSN: mysql:host=127.0.0.1;dbname=orders_test;charset=utf8mb4
      TEST_DB_USER: orders
      TEST_DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Through PDO rather than the runner's mysql client, which may not match the MariaDB server version.
      - name: Create schema
        run: php bin/run-sql.php database/schema.sql

      - name: Integration tests
        run: vendor/bin/phpunit --testsuite Integration

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start containers
        run: |
          docker compose run --rm app composer install --no-interaction --no-progress
          docker compose up -d --build --wait

      - name: Both versions show the same seeded order
        run: |
          modern=$(curl --fail --silent --retry 10 --retry-connrefused --retry-delay 2 'http://localhost:8080/order.php?id=1' | grep -o 'Итого: [^<]*')
          legacy=$(curl --fail --silent --retry 10 --retry-connrefused --retry-delay 2 'http://localhost:8081/order.php?id=1' | grep -o 'Итого: [^<]*')
          echo "modern: $modern"
          echo "legacy: $legacy"
          test -n "$modern"
          test "$modern" = "$legacy"

      - name: Logs on failure
        if: failure()
        run: docker compose logs
